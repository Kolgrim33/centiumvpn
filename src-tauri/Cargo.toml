[package]
name = "centium"
version = "1.0.0"
description = "Centium VPN - Privacy desktop app powered by Tor"
authors = ["Centium Core Team"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tauri = { version = "1.6", features = ["system-tray"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

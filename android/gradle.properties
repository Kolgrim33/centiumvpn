org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# App version. versionCode must equal major*10000 + minor*100 + patch (the build checks it);
# it's written out because F-Droid's update checker reads it from this file.
# Release: bump both, add a CHANGELOG.md section, push tag v<versionName>.
centium.versionName=1.3.0
centium.versionCode=10300
